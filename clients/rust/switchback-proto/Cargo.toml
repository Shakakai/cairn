[package]
name = "switchback-proto"
description = "Switchback v1 codec + connect-auth blob; shares test vectors with @cairn/core."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex-literal = "0.4"
