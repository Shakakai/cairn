[package]
name = "switchback-stun"
description = "RFC 5389 STUN Binding request/response (XOR-MAPPED-ADDRESS)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["net", "time"] }
getrandom = "0.2"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
