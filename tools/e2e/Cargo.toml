[package]
name = "e2e"
description = "End-to-end scenarios against a Cairn deployment (docs/08)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
switchback-endpoint = { workspace = true }
switchback-proto = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
tokio-tungstenite = { version = "0.30" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
