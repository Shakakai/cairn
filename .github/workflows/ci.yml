name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript (build, test, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains (mise)
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      - name: Lint
        run: pnpm lint

      # M4 acceptance: the e2e scenarios run against a local Node relay (dist was built
      # in the Build step).
      - name: Start local Cairn for e2e
        run: |
          RELAY_CONFIG='{"access":{"mode":"open"},"ports":{"relay":18080,"admin":18090}}' \
            node packages/adapter-node/dist/main.js > /tmp/cairn-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18080/healthz > /dev/null 2>&1; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:18080/healthz

      - name: e2e scenarios
        run: cargo run -p e2e -- --cairn ws://127.0.0.1:18080 --scenario all

      # M7: restart (drain via the admin port) and max-age (a relay with a 2.5s
      # connection-age limit) prove C3 make-before-break with zero message loss.
      - name: Start aged Cairn for max-age
        run: |
          RELAY_CONFIG='{"access":{"mode":"open"},"ports":{"relay":18082,"admin":18092},"maxConnectionAgeMs":4000}' \
            node packages/adapter-node/dist/main.js > /tmp/cairn-aged.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18082/healthz > /dev/null 2>&1; then break; fi
            sleep 0.5
          done

      - name: e2e restart and max-age
        timeout-minutes: 10
        run: |
          cargo run -p e2e -- --cairn ws://127.0.0.1:18080 --scenario restart --cairn-admin http://127.0.0.1:18090
          cargo run -p e2e -- --cairn ws://127.0.0.1:18082 --scenario max-age

      # M5 (local half): Cloudflare adapter under Miniflare + full smoke against
      # `wrangler dev` (real workerd). Staging deploy + doc-04 risk measurements need
      # Cloudflare credentials (deploy/cloudflare/README.md).
      - name: Cloudflare adapter tests (Miniflare)
        run: pnpm --filter @cairn/adapter-cloudflare test

      - name: Cloudflare e2e against wrangler dev
        run: scripts/test-cf-host.sh smoke

  rust:
    name: Rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains (mise)
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Test
        run: cargo test --workspace --locked

      - name: Install clippy component
        run: rustup component add clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Regenerating vectors must not change the committed files without a matching
      # doc 01 change (docs/08 §1).
      - name: Vector parity
        run: |
          cargo run -p vectors -- --out /tmp/vectors-check
          diff -r packages/core/test/vectors /tmp/vectors-check
