name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript (build, test, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains (mise)
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      - name: Lint
        run: pnpm lint

  rust:
    name: Rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains (mise)
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Test
        run: cargo test --workspace --locked

      - name: Install clippy component
        run: rustup component add clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Regenerating vectors must not change the committed files without a matching
      # doc 01 change (docs/08 §1).
      - name: Vector parity
        run: |
          cargo run -p vectors -- --out /tmp/vectors-check
          diff -r packages/core/test/vectors /tmp/vectors-check
